[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiotg"
dynamic = ["version"]
description = "Asynchronous Python API for building Telegram bots"
readme = "README.rst"
license = "MIT"
authors = [
    { name = "Stepan Zastupov", email = "stepan.zastupov@gmail.com" },
]
keywords = [
    "asyncio",
    "telegram",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "aiohttp>=3.8.0",
    "watchdog>=0.9.0",
]
requires-python = ">= 3.12"

[project.urls]
Homepage = "http://szastupov.github.io/aiotg"

[tool.hatch.version]
path = "aiotg/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/aiotg",
]

[tool.hatch.envs.test]
dependencies = [
    "pytest",
    "testfixtures",
]

[tool.hatch.envs.test.scripts]
run = "pytest"

[tool.hatch.envs.lint]
detached = true
dependencies = [
  "black>=22.10.0",
  "flake8"
]

[tool.hatch.envs.lint.scripts]
style = [
    "flake8 {args:.}",
    "black --check --diff {args:.}"
]
fmt = [
  "black {args:.}",
  "style",
]
all = [
    "style"
]

[tool.ruff.lint.per-file-ignores]
# ruff never flags `from aiotg.bot import *` itself (F403 isn't in its
# default rule set here), so any noqa on that line always looks "unused"
# to ruff's own RUF100 - but flake8 (the project's actual lint gate) does
# need it, to suppress its real F401/F403 on the star-import.
"aiotg/__init__.py" = ["RUF100"]

[tool.black]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.eggs
  | _build
  | build
  | dist
)/
'''

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "testfixtures>=8.3.0",
]
